# Production PostgreSQL application-example.yml for ConnectAI
server:
  port: 8080

spring:
  application:
    name: ConnectAI-Backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/connectaidb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: your_postgres_password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

connectai:
  jwt:
    secret: YOUR_SECURE_256_BIT_JWT_SECRET_KEY_HERE_2026_2027
    expiration-ms: 86400000 # 24 hours
  
  google:
    client-id: YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com
    client-secret: YOUR_GOOGLE_OAUTH_CLIENT_SECRET

  ai:
    api-key: YOUR_GEMINI_OR_OPENAI_API_KEY
    model: gemini-1.5-flash
    mock-fallback-enabled: true

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
