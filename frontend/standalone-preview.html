<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI-Integrated People Chat Application - AKGEC (2026-2027)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons Library (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React 18 & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-main: #0c0e14;
      --bg-secondary: #131722;
      --bg-tertiary: #1c2230;
      --bg-surface: #161b28;
      --bg-hover: #22293b;
      --bg-active: #2d364d;
      
      /* Coolors Palette (Solid Flat Colors): #f7b267 - #f79d65 - #f4845f - #f27059 - #f25c54 */
      --color-c1: #f7b267;
      --color-c2: #f79d65;
      --color-c3: #f4845f;
      --color-c4: #f27059;
      --color-c5: #f25c54;

      --color-primary: #f4845f;
      --color-primary-hover: #f25c54;
      --color-primary-light: rgba(244, 132, 95, 0.15);
      --color-ai: #f79d65;
      --color-accent: #f7b267;
      --color-success: #10b981;
      --color-danger: #f25c54;
      --text-primary: #fdfdfd;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #263044;
      --border-light: rgba(247, 178, 103, 0.15);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      --header-height: 60px;
      --sidebar-width: 320px;
      --ai-panel-width: 360px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -ms-overflow-style: none; 
      scrollbar-width: none; 
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { display: none; width: 0px; height: 0px; }
    
    body, html, #root { 
      height: 100%; 
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%; 
      font-family: var(--font-family); 
      background-color: var(--bg-main); 
      color: var(--text-primary); 
      overflow: hidden; 
    }

    /* PHONE AUTH PAGE */
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100vw;
      background: var(--bg-main);
      padding: 1rem;
      overflow-y: auto;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem 1.75rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      margin: auto;
    }
    .auth-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .phone-input-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }
    .country-select {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      padding: 0.7rem 0.6rem;
      font-size: 0.9rem;
      outline: none;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .country-select:focus { border-color: var(--color-primary); }

    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-label { font-size: 0.82rem; font-weight: 500; color: var(--text-secondary); }
    .form-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }
    .form-input:focus { border-color: var(--color-primary); }

    .otp-digit-inputs {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      margin: 0.5rem 0;
    }
    .otp-digit-input {
      width: 50px;
      height: 52px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--color-c1);
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .otp-digit-input:focus { border-color: var(--color-primary); }

    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider-text span { padding: 0 0.75rem; }

    /* MAIN APP STYLES */
    .app-container { 
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      height: 100dvh; 
      min-height: 100dvh; 
      width: 100vw; 
      overflow: hidden; 
      position: relative;
    }
    .navbar { 
      height: var(--header-height); 
      background: var(--bg-surface); 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 1.25rem; 
      z-index: 30; 
      flex-shrink: 0; 
    }
    .nav-brand { display: flex; align-items: center; gap: 0.65rem; font-weight: 700; font-size: 1.15rem; color: var(--text-primary); text-decoration: none; cursor: pointer; }
    .brand-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--color-c4); display: flex; align-items: center; justify-content: center; color: #ffffff; flex-shrink: 0; }
    .brand-tag { font-size: 0.68rem; padding: 2px 6px; background: rgba(247, 157, 101, 0.2); color: var(--color-c1); border-radius: 4px; border: 1px solid rgba(247, 157, 101, 0.4); margin-left: 6px; font-weight: 600; text-transform: uppercase; }
    
    .nav-center-badge { display: flex; align-items: center; gap: 0.5rem; background: rgba(16, 185, 129, 0.12); color: var(--color-success); border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.35rem 0.85rem; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 500; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-success); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
    
    .nav-actions { display: flex; align-items: center; gap: 0.5rem; }
    .btn-device-connect {
      background: rgba(244, 132, 95, 0.15);
      border: 1px solid var(--color-c3);
      color: var(--color-c1);
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-device-connect:hover { background: rgba(244, 132, 95, 0.25); }

    .btn-ai-toggle { background: rgba(247, 157, 101, 0.15); border: 1px solid rgba(247, 157, 101, 0.4); color: var(--color-c1); padding: 0.4rem 0.75rem; border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-ai-toggle:hover { background: rgba(247, 157, 101, 0.25); }
    
    .user-profile-badge { 
      display: flex; 
      align-items: center; 
      gap: 0.45rem; 
      padding: 0.35rem 0.75rem; 
      border-radius: var(--radius-full); 
      background: var(--bg-tertiary); 
      border: 1px solid var(--border-color); 
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s ease;
    }
    .user-profile-badge:hover { border-color: var(--color-primary); }

    .dashboard-layout { 
      display: flex; 
      flex: 1; 
      height: calc(100% - var(--header-height)); 
      height: calc(100dvh - var(--header-height));
      width: 100vw; 
      overflow: hidden; 
      position: relative; 
    }
    .sidebar { width: var(--sidebar-width); background: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; height: 100%; overflow: hidden; }
    .sidebar-header { padding: 0.85rem 1rem 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .sidebar-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
    .search-box { padding: 0.35rem 1rem; position: relative; flex-shrink: 0; }
    .search-input { width: 100%; padding: 0.55rem 0.85rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.85rem; outline: none; }
    .filter-tabs { display: flex; padding: 0.35rem 1rem; gap: 0.4rem; flex-shrink: 0; }
    .filter-tab { flex: 1; padding: 0.35rem 0.5rem; border-radius: var(--radius-sm); background: transparent; border: 1px solid transparent; color: var(--text-secondary); font-size: 0.78rem; font-weight: 500; cursor: pointer; text-align: center; }
    .filter-tab.active { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-color); }
    
    .conversations-list { flex: 1; overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.25rem; min-height: 0; }
    .conversation-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.9rem; border-radius: var(--radius-md); cursor: pointer; position: relative; user-select: none; }
    .conversation-item:hover { background: var(--bg-hover); }
    .conversation-item.active { background: var(--bg-active); border-left: 3px solid var(--color-primary); }
    
    .conv-status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .conv-status-dot.online { background: var(--color-success); }
    .conv-status-dot.offline { background: var(--text-muted); }

    .conv-details { flex: 1; min-width: 0; }
    .conv-top-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.2rem; }
    .conv-name { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { font-size: 0.7rem; color: var(--text-muted); }
    .conv-bottom-row { display: flex; justify-content: space-between; align-items: center; }
    .conv-last-msg { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .unread-badge { background: var(--color-primary); color: white; font-size: 0.68rem; font-weight: 700; padding: 2px 6px; border-radius: var(--radius-full); }

    .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); height: 100%; position: relative; overflow: hidden; min-width: 0; }
    .chat-header { height: var(--header-height); background: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 0 1rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .chat-header-info { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
    .chat-header-title { font-size: 0.98rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-header-subtitle { font-size: 0.72rem; color: var(--color-success); display: flex; align-items: center; gap: 4px; }
    .chat-header-actions { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }
    .btn-icon { background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); width: 36px; height: 36px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }

    .mobile-back-btn { display: none; }

    .in-chat-search-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .messages-stream { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; min-height: 0; }
    .message-date-divider { display: flex; align-items: center; justify-content: center; margin: 0.35rem 0; }
    .message-date-divider span { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 0.2rem 0.65rem; border-radius: var(--radius-full); font-size: 0.68rem; color: var(--text-muted); }
    .message-row { display: flex; flex-direction: column; max-width: 76%; position: relative; }
    .message-row.sent { align-self: flex-end; align-items: flex-end; }
    .message-row.received { align-self: flex-start; align-items: flex-start; }
    
    .message-bubble { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 0.7rem 0.95rem; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 0.3rem; width: 100%; }
    .message-row.sent .message-bubble { background: var(--color-c4); border: 1px solid var(--color-c4); border-bottom-right-radius: 4px; }
    .message-row.received .message-bubble { border-bottom-left-radius: 4px; }
    .message-sender-name { font-size: 0.75rem; font-weight: 600; color: var(--color-c1); }
    .message-text { font-size: 0.92rem; line-height: 1.45; color: var(--text-primary); word-break: break-word; white-space: pre-wrap; }
    .message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 0.4rem; font-size: 0.68rem; color: rgba(255, 255, 255, 0.75); }

    /* REAL VOICE NOTE PLAYER */
    .voice-note-bubble {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius-md);
      margin-top: 4px;
      min-width: 200px;
    }
    .btn-play-voice {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--color-primary);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }
    .btn-play-voice:hover { transform: scale(1.08); }
    .btn-play-voice.playing { background: var(--color-success); }
    .voice-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px;
      flex: 1;
    }
    .wave-bar {
      width: 3px;
      background: var(--color-c1);
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--color-c1);
      padding: 0.35rem 1rem;
      font-style: italic;
    }

    .smart-replies-container { padding: 0.4rem 1rem; background: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.5rem; overflow-x: auto; white-space: nowrap; flex-shrink: 0; }
    .smart-reply-label { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; color: var(--color-c1); flex-shrink: 0; }
    .smart-reply-chip { background: rgba(247, 178, 103, 0.12); border: 1px solid rgba(247, 178, 103, 0.3); color: var(--color-c1); padding: 0.3rem 0.75rem; border-radius: var(--radius-full); font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .smart-reply-chip:hover { background: rgba(247, 178, 103, 0.25); border-color: var(--color-c2); }

    .chat-input-container { 
      padding: 0.65rem 1rem calc(0.65rem + env(safe-area-inset-bottom, 0px)) 1rem; 
      background: var(--bg-surface); 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      gap: 0.5rem; 
      flex-shrink: 0;
    }
    .chat-input-wrapper { flex: 1; position: relative; display: flex; align-items: center; min-width: 0; }
    .chat-textarea { 
      width: 100%; 
      min-height: 42px; 
      max-height: 120px; 
      padding: 0.65rem 0.85rem; 
      background: var(--bg-secondary); 
      border: 1px solid var(--border-color); 
      border-radius: var(--radius-md); 
      color: var(--text-primary); 
      font-size: 0.92rem; 
      resize: none; 
      outline: none; 
      font-family: inherit; 
    }
    .chat-textarea:focus { border-color: var(--color-primary); }
    .btn-send { background: var(--color-primary); color: white; border: none; width: 42px; height: 42px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .btn-send:hover { background: var(--color-primary-hover); }

    .ai-panel { width: var(--ai-panel-width); background: var(--bg-surface); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; height: 100%; overflow: hidden; }
    .ai-panel-header { padding: 1rem 1.15rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .ai-panel-title { display: flex; align-items: center; gap: 0.5rem; font-size: 0.98rem; font-weight: 700; color: var(--color-c1); }
    .ai-panel-content { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .ai-feature-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .ai-feature-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.86rem; font-weight: 600; color: var(--text-primary); }
    .ai-select { width: 100%; padding: 0.45rem 0.7rem; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.82rem; outline: none; }
    .btn-ai-action { background: var(--color-c3); color: white; border: none; padding: 0.5rem 0.85rem; border-radius: var(--radius-md); font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.45rem; cursor: pointer; }
    .btn-ai-action:hover { background: var(--color-c4); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 80; }
    .modal-content { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; margin: auto; }
    .modal-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .modal-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; overflow-y: auto; }
    .modal-footer { padding: 0.85rem 1.25rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: flex-end; gap: 0.65rem; flex-shrink: 0; }
    .btn-secondary { background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.5rem 0.9rem; border-radius: var(--radius-md); font-size: 0.82rem; font-weight: 500; cursor: pointer; }
    .btn-secondary:hover { background: var(--bg-hover); }
    .btn-primary { background: var(--color-primary); border: none; color: white; padding: 0.5rem 0.9rem; border-radius: var(--radius-md); font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--color-primary-hover); }

    /* ========================================== */
    /* 📱 MOBILE RESPONSIVE TWEAKS               */
    /* ========================================== */
    @media screen and (max-width: 1024px) {
      .ai-panel { position: absolute; right: 0; top: 0; bottom: 0; height: 100%; transform: translateX(100%); transition: transform 0.25s ease; }
      .ai-panel.open { transform: translateX(0); }
    }

    @media screen and (max-width: 768px) {
      :root {
        --header-height: 56px;
      }
      .navbar { padding: 0 0.75rem; }
      .brand-tag { display: none; }
      .nav-center-badge { display: none; }
      .btn-device-connect span { display: none; }
      .btn-ai-toggle span { display: none; }
      .user-profile-badge span { max-width: 85px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Mobile Screen Transition (List <-> Active Chat) */
      .dashboard-layout.mobile-mode-list .sidebar {
        display: flex !important;
        width: 100% !important;
        height: 100% !important;
        position: absolute !important;
        inset: 0 !important;
        z-index: 10;
      }
      .dashboard-layout.mobile-mode-list .chat-main {
        display: none !important;
      }

      .dashboard-layout.mobile-mode-chat .sidebar {
        display: none !important;
      }
      .dashboard-layout.mobile-mode-chat .chat-main {
        display: flex !important;
        width: 100% !important;
        height: 100% !important;
        position: absolute !important;
        inset: 0 !important;
        z-index: 10;
      }

      .mobile-back-btn {
        display: inline-flex !important;
      }

      .chat-header {
        padding: 0 0.75rem;
      }

      .messages-stream {
        padding: 0.75rem 0.85rem;

  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEMO_PHONE_USERS = [
      { phone: '+919876543210', formattedPhone: '+91 98765 43210', name: 'Abdul Mannan', role: 'Student Lead' },
      { phone: '+919876543211', formattedPhone: '+91 98765 43211', name: 'Aditya Maurya', role: 'Student / Backend' },
      { phone: '+919876543212', formattedPhone: '+91 98765 43212', name: 'Mr. Sudhakar Dwivedi', role: 'Faculty Guide' },
      { phone: '+919876543213', formattedPhone: '+91 98765 43213', name: 'Aditya Vishwakarma', role: 'Student / Frontend' },
      { phone: '+919876543214', formattedPhone: '+91 98765 43214', name: 'Abhishek Gangwar', role: 'Student / QA' }
    ];

    const COUNTRY_CODES = [
      { code: '+91', flag: '🇮🇳', name: 'India (+91)' },
      { code: '+1', flag: '🇺🇸', name: 'USA (+1)' },
      { code: '+44', flag: '🇬🇧', name: 'UK (+44)' },
      { code: '+971', flag: '🇦🇪', name: 'UAE (+971)' },
      { code: '+61', flag: '🇦🇺', name: 'Australia (+61)' },
      { code: '+49', flag: '🇩🇪', name: 'Germany (+49)' },
      { code: '+33', flag: '🇫🇷', name: 'France (+33)' },
      { code: '+81', flag: '🇯🇵', name: 'Japan (+81)' },
      { code: '+86', flag: '🇨🇳', name: 'China (+86)' },
      { code: '+7', flag: '🇷🇺', name: 'Russia (+7)' }
    ];

    function normalizePhone(input, countryCode = '+91') {
      if (!input) return '+919876543210';
      let cleaned = input.toString().replace(/[\s\-\(\)\.]/g, '');
      if (!cleaned.startsWith('+')) {
        if (cleaned.length === 10) {
          cleaned = countryCode + cleaned;
        } else {
          cleaned = '+' + cleaned;
        }
      }
      return cleaned;
    }

    function formatDisplayPhone(normalized) {
      if (!normalized) return '';
      if (normalized.startsWith('+91') && normalized.length === 13) {
        return `+91 ${normalized.slice(3, 8)} ${normalized.slice(8)}`;
      }
      return normalized;
    }

    function derivePhoneProfile(rawPhone, customName = '', countryCode = '+91') {
      const normalized = normalizePhone(rawPhone, countryCode);
      const known = DEMO_PHONE_USERS.find(u => u.phone === normalized);
      const name = customName && customName.trim() ? customName.trim() : (known ? known.name : `User (${normalized.slice(-4)})`);

      return {
        id: `u-${Date.now()}`,
        name: name,
        phone: normalized,
        formattedPhone: formatDisplayPhone(normalized),
        role: known?.role || 'User'
      };
    }

    function getConversationDisplayTitle(conv, currentUser, registeredUsers = []) {
      if (!conv) return 'Chat';
      if (conv.isGroup) return conv.title || 'Group Chat';
      if (conv.participants && Array.isArray(conv.participants)) {
        const otherPhone = conv.participants.find(p => p && normalizePhone(p) !== normalizePhone(currentUser?.phone));
        if (otherPhone) {
          const normOther = normalizePhone(otherPhone);
          const otherUser = registeredUsers.find(u => normalizePhone(u.phone) === normOther);
          if (otherUser && otherUser.name) return `${otherUser.name} (${formatDisplayPhone(normOther)})`;
          const known = DEMO_PHONE_USERS.find(u => u.phone === normOther);
          if (known) return `${known.name} (${known.formattedPhone})`;
          return formatDisplayPhone(normOther);
        }
      }
      return conv.title || 'Direct Chat';
    }

    const SMART_REPLIES_DATA = {
      'default': [
        'Sounds great, let us proceed!',
        'Understood, let me check and get back to you.',
        'Could you provide more details on this?',
        'Yes, that works perfectly.',
        'I am reviewing the updates now.'
      ]
    };

    const playNotificationSound = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    };

    // Synthesize audible voice playback audio note
    const playAudibleVoiceNote = (durationSeconds = 3, onEnd) => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const freqs = [330, 440, 520, 660, 580, 490, 440, 390];
        
        freqs.forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.35);
          gain.gain.setValueAtTime(0.12, now + idx * 0.35);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (idx + 1) * 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.35);
          osc.stop(now + (idx + 1) * 0.35);
        });

        setTimeout(() => {
          if (onEnd) onEnd();
        }, freqs.length * 350);
      } catch (e) {
        if (onEnd) setTimeout(onEnd, 2000);
      }
    };

    // Voice Player Component (Plays real recorded audio or synthesized voice note)
    function VoiceNotePlayer({ msg }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);

      const togglePlay = () => {
        if (isPlaying) {
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current.currentTime = 0;
          }
          setIsPlaying(false);
          return;
        }

        if (msg.audioData && msg.audioData.startsWith('data:audio')) {
          try {
            if (!audioRef.current) {
              audioRef.current = new Audio(msg.audioData);
              audioRef.current.onended = () => setIsPlaying(false);
              audioRef.current.onerror = () => {
                playAudibleVoiceNote(3, () => setIsPlaying(false));
              };
            }
            audioRef.current.play()
              .then(() => setIsPlaying(true))
              .catch(() => {
                playAudibleVoiceNote(3, () => setIsPlaying(false));
                setIsPlaying(true);
              });
          } catch (e) {
            playAudibleVoiceNote(3, () => setIsPlaying(false));
            setIsPlaying(true);
          }
        } else {
          setIsPlaying(true);
          playAudibleVoiceNote(3, () => setIsPlaying(false));
        }
      };

      return (
        <div className="voice-note-bubble">
          <button className={`btn-play-voice ${isPlaying ? 'playing' : ''}`} onClick={togglePlay}>
            <i data-lucide={isPlaying ? "pause" : "play"} style={{ width: '15px' }}></i>
          </button>
          <div className="voice-wave">
            {[10, 18, 6, 22, 14, 28, 12, 20, 16, 8, 24, 14].map((h, i) => (
              <div 
                key={i} 
                className="wave-bar" 
                style={{ 
                  height: `${isPlaying ? Math.max(6, (h * (Math.sin(Date.now() / 200 + i) + 1.2))) : h}px`,
                  background: isPlaying ? 'var(--color-success)' : 'var(--color-c1)' 
                }}
              ></div>
            ))}
          </div>
          <span style={{ fontSize: '0.72rem', color: isPlaying ? 'var(--color-success)' : 'var(--text-muted)', fontWeight: 600 }}>
            {isPlaying ? 'Playing...' : (msg.duration || 'Voice Note')}
          </span>
        </div>
      );
    }

    function App() {
      // AUTH STATE (PHONE NUMBER BASED)
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('ai_chat_phone_user');
        return saved ? JSON.parse(saved) : DEMO_PHONE_USERS[0];
      });
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return localStorage.getItem('ai_chat_phone_logged_in') === 'true';
      });

      // AUTH FORM
      const [countryCode, setCountryCode] = useState('+91');
      const [phoneNumber, setPhoneNumber] = useState('');
      const [userName, setUserName] = useState('');
      const [otpModal, setOtpModal] = useState(false);
      const [enteredOtp, setEnteredOtp] = useState(['1', '2', '3', '4']);
      const [pendingProfile, setPendingProfile] = useState(null);

      // PROFILE EDIT MODAL
      const [profileModal, setProfileModal] = useState(false);
      const [editName, setEditName] = useState('');

      // APP DATA (DYNAMIC REAL-TIME ONLY - PHONE-KEYED)
      const [conversations, setConversations] = useState([]);
      const [activeId, setActiveId] = useState(null);
      const [messages, setMessages] = useState({});
      const [registeredUsers, setRegisteredUsers] = useState([]);
      const [onlinePhones, setOnlinePhones] = useState([]);
      const [networkInfo, setNetworkInfo] = useState({ ip: 'localhost', port: 3000, networkUrl: window.location.origin });

      // CHAT INPUT & UI
      const [inputText, setInputText] = useState('');
      const [isAiOpen, setIsAiOpen] = useState(false);
      const [filter, setFilter] = useState('all');
      const [typingUser, setTypingUser] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showSearchInChat, setShowSearchInChat] = useState(false);
      const [isRecordingVoice, setIsRecordingVoice] = useState(false);
      const [recordingSeconds, setRecordingSeconds] = useState(0);

      // MEDIA RECORDER REFS FOR REAL VOICE NOTES
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      // MODALS
      const [deviceConnectModal, setDeviceConnectModal] = useState(false);
      const [suggestionModal, setSuggestionModal] = useState(null);
      const [summaryModal, setSummaryModal] = useState(false);
      const [newChatModal, setNewChatModal] = useState(false);
      const [newChatPhone, setNewChatPhone] = useState('');
      const [newChatName, setNewChatName] = useState('');
      const [newChatTab, setNewChatTab] = useState('online'); // 'online' | 'direct'
      const [lightboxImage, setLightboxImage] = useState(null);
      const imageAttachmentRef = useRef(null);

      // AI ASSISTANT STATES
      const [tone, setTone] = useState('formal');
      const [lang, setLang] = useState('Hindi');
      const [customTranslateText, setCustomTranslateText] = useState('');
      const [isTranslating, setIsTranslating] = useState(false);

      const messagesEndRef = useRef(null);
      const sseRef = useRef(null);
      const activeIdRef = useRef(activeId);
      const typingTimeoutRef = useRef(null);
      const typingThrottleRef = useRef(null);

      useEffect(() => {
        activeIdRef.current = activeId;
        setTypingUser(null);
      }, [activeId]);

      // 1. Initial Sync & Fetch from Server (Phone-Based)
      useEffect(() => {
        const fetchInitialData = async () => {
          try {
            const res = await fetch('/api/live/sync?phone=' + encodeURIComponent(currentUser?.phone || ''));
            if (res.ok) {
              const data = await res.json();
              if (data.conversations) {
                setConversations(data.conversations);
                if (window.innerWidth > 768 && data.conversations.length > 0 && !activeId) {
                  setActiveId(data.conversations[0].id);
                }
              }
              if (data.messages) setMessages(data.messages);
              if (data.users) setRegisteredUsers(data.users);
              if (data.onlinePhones) setOnlinePhones(data.onlinePhones);
              if (data.networkUrl) setNetworkInfo(prev => ({ ...prev, networkUrl: data.networkUrl }));
            }
          } catch (e) {
            console.log('Sync fallback:', e);
          }
        };

        const fetchNetInfo = async () => {
          try {
            const res = await fetch('/api/live/network-info');
            if (res.ok) {
              const info = await res.json();
              setNetworkInfo(info);
              if (info.connectedPhones) {
                setOnlinePhones(info.connectedPhones);
              }
            }
          } catch (e) {}
        };

        fetchInitialData();
        fetchNetInfo();
      }, [currentUser?.phone]);

      // 2. Real-Time Multi-Device SSE Event Stream (Phone-Based)
      useEffect(() => {
        if (!isLoggedIn || !currentUser?.phone) return;

        const connectSSE = () => {
          const sseUrl = `/api/live/stream?phone=${encodeURIComponent(currentUser.phone)}&name=${encodeURIComponent(currentUser.name || '')}`;
          const es = new EventSource(sseUrl);
          sseRef.current = es;

          es.addEventListener('NEW_MESSAGE', (e) => {
            const data = JSON.parse(e.data);
            setMessages(prev => ({
              ...prev,
              [data.convId]: [...(prev[data.convId] || []), data.message]
            }));
            
            // If message is in active conversation, clear typing indicator immediately
            if (data.convId === activeIdRef.current) {
              setTypingUser(null);
            }

            // Update or add conversation
            setConversations(prev => {
              const exists = prev.some(c => c.id === data.convId);
              if (exists) {
                return prev.map(c => {
                  if (c.id === data.convId) {
                    return {
                      ...c,
                      lastMessage: {
                        text: data.message.text || (data.message.audio ? '🎤 Voice Message' : (data.message.image ? '📷 Photo' : 'Attachment')),
                        timestamp: data.message.timestamp
                      }
                    };
                  }
                  return c;
                });
              } else if (data.conv) {
                return [data.conv, ...prev];
              }
              return prev;
            });

            if (normalizePhone(data.message.senderPhone) !== normalizePhone(currentUser.phone)) {
              playNotificationSound();
            }
          });

          es.addEventListener('TYPING', (e) => {
            const data = JSON.parse(e.data);
            if (
              data.convId && 
              data.convId === activeIdRef.current && 
              normalizePhone(data.userPhone) !== normalizePhone(currentUser.phone)
            ) {
              setTypingUser(data.userName || formatDisplayPhone(data.userPhone));
              if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);
              typingTimeoutRef.current = setTimeout(() => {
                setTypingUser(null);
              }, 2500);
            }
          });

          es.addEventListener('USER_STATUS_CHANGE', (e) => {
            const data = JSON.parse(e.data);
            setOnlinePhones(prev => {
              const norm = normalizePhone(data.phone);
              if (data.isOnline) {
                return Array.from(new Set([...prev, norm]));
              } else {
                return prev.filter(p => normalizePhone(p) !== norm);
              }
            });
            if (data.user) {
              setRegisteredUsers(prev => {
                const exists = prev.some(u => normalizePhone(u.phone) === normalizePhone(data.user.phone));
                if (!exists) return [...prev, data.user];
                return prev.map(u => normalizePhone(u.phone) === normalizePhone(data.user.phone) ? data.user : u);
              });
            }
          });

          es.addEventListener('USER_JOINED', (e) => {
            const user = JSON.parse(e.data);
            if (user && user.phone) {
              setRegisteredUsers(prev => {
                const exists = prev.some(u => normalizePhone(u.phone) === normalizePhone(user.phone));
                if (!exists) return [...prev, user];
                return prev.map(u => normalizePhone(u.phone) === normalizePhone(user.phone) ? user : u);
              });
            }
          });

          es.addEventListener('PROFILE_UPDATED', (e) => {
            const user = JSON.parse(e.data);
            if (user && user.phone) {
              setRegisteredUsers(prev => prev.map(u => normalizePhone(u.phone) === normalizePhone(user.phone) ? { ...u, ...user } : u));
            }
          });

          es.addEventListener('CONVERSATION_CREATED', (e) => {
            const newConv = JSON.parse(e.data);
            setConversations(prev => {
              const exists = prev.some(c => c.id === newConv.id);
              if (exists) return prev;
              return [newConv, ...prev];
            });
          });

          es.onerror = () => {
            es.close();
            setTimeout(connectSSE, 4000);
          };
        };

        connectSSE();

        return () => {
          if (sseRef.current) sseRef.current.close();
        };
      }, [isLoggedIn, currentUser?.phone]);

      // Save user session
      useEffect(() => {
        localStorage.setItem('ai_chat_phone_user', JSON.stringify(currentUser));
        localStorage.setItem('ai_chat_phone_logged_in', isLoggedIn ? 'true' : 'false');
      }, [currentUser, isLoggedIn]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, activeId, typingUser]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // ESC key listener to close Lightbox
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && lightboxImage) {
            setLightboxImage(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [lightboxImage]);

      // VOICE RECORDING TIMER
      useEffect(() => {
        let interval;
        if (isRecordingVoice) {
          interval = setInterval(() => {
            setRecordingSeconds(s => s + 1);
          }, 1000);
        } else {
          setRecordingSeconds(0);
        }
        return () => clearInterval(interval);
      }, [isRecordingVoice]);

      // Explicit user registration call (Phone)
      const syncUserWithServer = async (profile) => {
        try {
          await fetch('/api/live/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: profile.phone, name: profile.name })
          });
        } catch (e) {}
      };

      // PHONE LOGIN SUBMIT -> OPENS OTP MODAL
      const handlePhoneSubmit = (e) => {
        e.preventDefault();
        if (!phoneNumber || !phoneNumber.trim()) return;
        const profile = derivePhoneProfile(phoneNumber, userName, countryCode);
        setPendingProfile(profile);
        setOtpModal(true);
      };

      // COMPLETE OTP VERIFICATION
      const handleVerifyOtp = (e) => {
        if (e) e.preventDefault();
        if (!pendingProfile) return;
        setCurrentUser(pendingProfile);
        setIsLoggedIn(true);
        setOtpModal(false);
        syncUserWithServer(pendingProfile);
      };

      // 1-CLICK QUICK TEAM LOGIN
      const handleQuickTeamLogin = (teamUser) => {
        const profile = derivePhoneProfile(teamUser.phone, teamUser.name);
        setCurrentUser(profile);
        setIsLoggedIn(true);
        syncUserWithServer(profile);
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setActiveId(null);
      };

      // SAVE EDITED NAME
      const handleSaveProfileName = async (e) => {
        e.preventDefault();
        if (!editName || !editName.trim()) return;
        const updated = { ...currentUser, name: editName.trim() };
        setCurrentUser(updated);
        setProfileModal(false);
        try {
          await fetch('/api/live/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: currentUser.phone, name: editName.trim() })
          });
        } catch (err) {}
      };

      // START CHAT WITH USER (CONNECTED PEER)
      const startChatWithUser = async (user) => {
        if (!user || !user.phone) return;
        const targetPhone = normalizePhone(user.phone);
        const currentPhone = normalizePhone(currentUser.phone);

        // Check if conversation already exists
        const existingConv = conversations.find(c =>
          !c.isGroup && c.participants && c.participants.map(p => normalizePhone(p)).includes(targetPhone)
        );

        if (existingConv) {
          setActiveId(existingConv.id);
          setNewChatModal(false);
          return;
        }

        const resolvedTitle = user.name ? `${user.name} (${formatDisplayPhone(targetPhone)})` : formatDisplayPhone(targetPhone);
        const newConvId = `conv-${targetPhone.replace(/[^0-9]/g, '')}-${Date.now()}`;
        const newConv = {
          id: newConvId,
          title: resolvedTitle,
          isGroup: false,
          participants: [currentPhone, targetPhone],
          unreadCount: 0,
          lastMessage: {
            text: `Chat started with ${resolvedTitle}`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }
        };

        try {
          await fetch('/api/live/create-conv', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conv: newConv })
          });
        } catch (e) {}

        setConversations(prev => [newConv, ...prev.filter(c => c.id !== newConvId)]);
        setActiveId(newConvId);
        setNewChatModal(false);
      };

      // START DIRECT CHAT FROM PHONE / NAME FORM
      const handleStartDirectChat = (e) => {
        e.preventDefault();
        if (!newChatPhone || !newChatPhone.trim()) return;
        const targetPhone = normalizePhone(newChatPhone);
        const targetName = newChatName.trim() || '';
        startChatWithUser({ phone: targetPhone, name: targetName });
        setNewChatPhone('');
        setNewChatName('');
      };

      // SEND LIVE MESSAGE ACROSS NETWORK (PHONE-BASED)
      const handleSend = async (textToSend = inputText, attachment = null) => {
        if ((!textToSend || !textToSend.trim()) && !attachment) return;
        if (!activeId) {
          alert('Please select or start a conversation first!');
          return;
        }

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        
        const newMsg = {
          id: `msg-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
          senderPhone: currentUser.phone,
          senderName: currentUser.name || formatDisplayPhone(currentUser.phone),
          text: textToSend ? textToSend.trim() : '',
          image: attachment?.image || null,
          audio: attachment?.audio || null,
          audioData: attachment?.audioData || null,
          duration: attachment?.duration || null,
          timestamp: timeStr
        };

        const activeConvObj = conversations.find(c => c.id === activeId);

        try {
          await fetch('/api/live/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              convId: activeId,
              message: newMsg,
              convMeta: activeConvObj
            })
          });
        } catch (e) {
          setMessages(prev => ({
            ...prev,
            [activeId]: [...(prev[activeId] || []), newMsg]
          }));
        }

        setInputText('');
        setTypingUser(null);
      };

      // BROADCAST TYPING (PHONE-BASED)
      const handleInputChange = (e) => {
        setInputText(e.target.value);
        if (!activeId) return;
        
        if (!typingThrottleRef.current) {
          try {
            fetch('/api/live/typing', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                convId: activeId,
                userPhone: currentUser.phone,
                userName: currentUser.name || formatDisplayPhone(currentUser.phone)
              })
            });
          } catch (err) {}

          typingThrottleRef.current = setTimeout(() => {
            typingThrottleRef.current = null;
          }, 1500);
        }
      };

      // REAL VOICE NOTE RECORDING HANDLERS
      const handleToggleVoiceRecord = async () => {
        if (!activeId) {
          alert('Please select a conversation first to record voice notes!');
          return;
        }

        if (!isRecordingVoice) {
          // Start Recording
          try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              const mediaRecorder = new MediaRecorder(stream);
              mediaRecorderRef.current = mediaRecorder;
              audioChunksRef.current = [];

              mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                  audioChunksRef.current.push(e.data);
                }
              };

              mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                  const base64Audio = reader.result;
                  handleSend('', {
                    audio: true,
                    audioData: base64Audio,
                    duration: `${Math.max(recordingSeconds, 1)}s`
                  });
                };
                reader.readAsDataURL(audioBlob);

                // Stop all tracks
                stream.getTracks().forEach(t => t.stop());
              };

              mediaRecorder.start();
              setIsRecordingVoice(true);
            } else {
              throw new Error('MediaDevices not supported');
            }
          } catch (err) {
            console.warn('Using standard voice recorder fallback:', err);
            setIsRecordingVoice(true);
          }
        } else {
          // Stop & Send Voice Note
          setIsRecordingVoice(false);
          if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
            mediaRecorderRef.current.stop();
          } else {
            // Fallback audio note

              audioData: 'demo-voice-note',

          'Hindi': 'hi', 'Spanish': 'es', 'French': 'fr', 'German': 'de',
          'Russian': 'ru', 'Japanese': 'ja', 'Arabic': 'ar', 'Bengali': 'bn', 'Marathi': 'mr'

        const code = LANG_CODES[targetLang] || 'hi';

        if (DICTIONARY[code] && DICTIONARY[code][lower]) {
          return DICTIONARY[code][lower];
        }

        try {
          const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=autodetect|${code}`);
          if (res.ok) {
            const data = await res.json();
            if (data?.responseData?.translatedText) {

            }
          }

                  </p>
                  
                  <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--color-primary)', padding: '0.75rem 0.85rem', borderRadius: 'var(--radius-md)', width: '100%', fontWeight: 700, fontSize: '0.98rem', color: 'var(--color-c1)', userSelect: 'all', wordBreak: 'break-all' }}>
                    {networkInfo.networkUrl || `http://${networkInfo.ip}:${networkInfo.port}`}
                  </div>

                  <button 
                    className="btn-primary" 
                    style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', padding: '0.65rem' }}
                    onClick={() => {
                      const url = networkInfo.networkUrl || `http://${networkInfo.ip}:${networkInfo.port}`;
                      navigator.clipboard.writeText(url);
                      alert('Web Link copied to clipboard!\nOpen it on your phone browser.');
                    }}
                  >
                    <i data-lucide="copy" style={{ width: '15px', height: '15px' }}></i>
                    <span>Copy Web Link</span>
                  </button>

                  <div style={{ textAlign: 'left', background: 'var(--bg-secondary)', padding: '0.75rem', borderRadius: '8px', width: '100%', fontSize: '0.78rem', color: 'var(--text-secondary)' }}>
                    <div><strong>How to Log In from Phone:</strong></div>
                    <div>1. Open the copied link in your mobile browser.</div>
                    <div>2. Enter your unique mobile phone number and full name.</div>
                    <div>3. Complete OTP verification (Code: <strong>1234</strong>).</div>
                    <div>4. Enjoy live real-time person-to-person chat with AI assistance!</div>
                  </div>
                </div>
                <div className="modal-footer">
                  <button className="btn-secondary" onClick={() => setDeviceConnectModal(false)}>Close</button>
                </div>
              </div>
            </div>
          )}

          {/* AI Suggestion Review Modal */}
          {suggestionModal && (
            <div className="modal-overlay" onClick={() => setSuggestionModal(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>{suggestionModal.type === 'translate' ? `AI Translation (${suggestionModal.targetLang})` : 'Review AI Suggestion (Human-in-the-Loop)'}</h3>
                  <button className="btn-icon" onClick={() => setSuggestionModal(null)}><i data-lucide="x"></i></button>
                </div>
                <div className="modal-body">
                  <div style={{ background: 'var(--bg-secondary)', padding: '0.75rem', borderRadius: '8px', fontSize: '0.85rem' }}>
                    <div style={{ color: 'var(--text-muted)', fontSize: '0.72rem', fontWeight: 600 }}>ORIGINAL TEXT:</div>
                    <div>{suggestionModal.original}</div>
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '0.8rem', color: 'var(--color-c1)' }}>Processed / Editable Output:</label>
                    <textarea 
                      className="chat-textarea" 
                      style={{ minHeight: '80px', borderColor: 'var(--color-primary)' }}
                      value={suggestionModal.suggested}
                      onChange={(e) => setSuggestionModal({ ...suggestionModal, suggested: e.target.value })}
                    />
                  </div>
                </div>
                <div className="modal-footer">
                  <button className="btn-secondary" onClick={() => setSuggestionModal(null)}>Discard</button>
                  <button className="btn-secondary" onClick={() => { setInputText(suggestionModal.suggested); setSuggestionModal(null); }}>
                    Insert in Input
                  </button>
                  <button className="btn-primary" onClick={() => { handleSend(suggestionModal.suggested); setSuggestionModal(null); }}>
                    Send to Chat
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AI Summary Modal */}
          {summaryModal && (
            <div className="modal-overlay" onClick={() => setSummaryModal(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>AI Conversation Summary</h3>
                  <button className="btn-icon" onClick={() => setSummaryModal(false)}><i data-lucide="x"></i></button>
                </div>
                <div className="modal-body">
                  <p style={{ fontSize: '0.88rem', lineHeight: '1.5' }}>
                    Discussion regarding the <strong>AI-Integrated People Chat Application</strong> B.Tech IT Major Project (2026-2027) at AKGEC.
                  </p>
                  <h4 style={{ fontSize: '0.84rem', color: 'var(--color-c1)', marginTop: '0.4rem' }}>Key Points:</h4>
                  <ul style={{ paddingLeft: '1.25rem', fontSize: '0.84rem', color: 'var(--text-secondary)' }}>
                    <li>Cross-device real-time communication validated via unique Phone Number authentication.</li>
                    <li>Human-in-the-Loop AI Assistant provides tone rewriting, live translation, and voice message support.</li>
                    <li>Solid flat Coolors palette (#f7b267 to #f25c54) with zero visible scrollbars.</li>
                  </ul>
                  <h4 style={{ fontSize: '0.84rem', color: 'var(--color-c2)', marginTop: '0.4rem' }}>Action Items:</h4>
                  <div style={{ fontSize: '0.84rem' }}>• [x] Real-time cross-device SSE hub running on port 3000.</div>
                  <div style={{ fontSize: '0.84rem' }}>• [x] Phone number contact discovery and live peer syncing active.</div>
                </div>
                <div className="modal-footer">
                  <button className="btn-secondary" onClick={handleDownloadSummary}>Download (.txt)</button>
                  <button className="btn-primary" onClick={() => setSummaryModal(false)}>Done</button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* START NEW CONVERSATION MODAL (PHONE)       */}
          {/* ========================================== */}
          {newChatModal && (
            <div className="modal-overlay" onClick={() => setNewChatModal(false)}>
              <div className="modal-content" style={{ maxWidth: '460px' }} onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>Start New Conversation</h3>
                  <button className="btn-icon" onClick={() => setNewChatModal(false)}><i data-lucide="x"></i></button>
                </div>

                <div className="modal-body">
                  {/* Tabs: Online Connected Phones vs Direct Phone Entry */}
                  <div className="filter-tabs" style={{ padding: 0 }}>
                    <button 
                      className={`filter-tab ${newChatTab === 'online' ? 'active' : ''}`}
                      onClick={() => setNewChatTab('online')}
                    >
                      Online Phones ({onlinePeers.length})
                    </button>
                    <button 
                      className={`filter-tab ${newChatTab === 'direct' ? 'active' : ''}`}
                      onClick={() => setNewChatTab('direct')}
                    >
                      Enter Phone Number
                    </button>
                  </div>

                  {newChatTab === 'online' ? (
                    <div>
                      <p style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', marginBottom: '0.65rem' }}>
                        Connected phone peers on your Wi-Fi network:
                      </p>
                      {onlinePeers.length === 0 ? (
                        <div style={{ background: 'var(--bg-secondary)', padding: '1rem', borderRadius: '8px', textAlign: 'center', color: 'var(--text-muted)', fontSize: '0.84rem' }}>
                          <i data-lucide="wifi-off" style={{ width: '24px', height: '24px', margin: '0 auto 0.5rem', opacity: 0.5 }}></i>
                          <div>No other phones currently connected.</div>
                          <div style={{ fontSize: '0.75rem', marginTop: '4px' }}>
                            Open <code style={{ color: 'var(--color-c1)' }}>{networkInfo.networkUrl}</code> on another mobile phone or switch to "Enter Phone Number" tab.
                          </div>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.45rem', maxHeight: '200px', overflowY: 'auto' }}>
                          {onlinePeers.map((acc, idx) => {
                            const accDisplayName = acc.name || `User (${acc.phone.slice(-4)})`;
                            const accFormattedPhone = acc.formattedPhone || formatDisplayPhone(acc.phone);
                            return (
                              <div 
                                key={idx}
                                onClick={() => startChatWithUser(acc)}
                                style={{
                                  display: 'flex',
                                  alignItems: 'center',
                                  justifyContent: 'space-between',
                                  padding: '0.65rem 0.85rem',
                                  background: 'var(--bg-secondary)',
                                  borderRadius: 'var(--radius-md)',
                                  cursor: 'pointer',
                                  border: '1px solid var(--border-color)'
                                }}
                              >
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                                  <div className="conv-status-dot online"></div>
                                  <div>
                                    <div style={{ fontSize: '0.88rem', fontWeight: 600 }}>{accDisplayName}</div>
                                    <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>📱 {accFormattedPhone}</div>
                                  </div>
                                </div>
                                <button className="btn-primary" style={{ fontSize: '0.75rem', padding: '0.35rem 0.75rem' }}>
                                  💬 Chat
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  ) : (
                    <form onSubmit={handleStartDirectChat} style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                      <p style={{ fontSize: '0.82rem', color: 'var(--text-secondary)' }}>
                        Enter the phone number of the person you want to message:
                      </p>
                      <div className="form-group">
                        <label className="form-label">Recipient's Mobile Phone Number</label>
                        <input 
                          type="tel" 
                          className="form-input" 
                          placeholder="e.g. +91 98765 43211 or 9876543211" 
                          value={newChatPhone}
                          onChange={(e) => setNewChatPhone(e.target.value)}
                          required 
                        />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Recipient's Name (Optional)</label>
                        <input 
                          type="text" 
                          className="form-input" 
                          placeholder="e.g. Aditya Maurya" 
                          value={newChatName}
                          onChange={(e) => setNewChatName(e.target.value)}
                        />
                      </div>
                      <button type="submit" className="btn-primary" style={{ padding: '0.65rem', marginTop: '0.25rem' }}>
                        Start Conversation
                      </button>
                    </form>
                  )}
                </div>

                <div className="modal-footer">
                  <button className="btn-secondary" onClick={() => setNewChatModal(false)}>Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
